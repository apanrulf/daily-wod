name: Förnya Instagram-token

on:
  schedule:
    - cron: "0 3 * * 1" # Varje måndag 03:00 UTC. Token gäller 60 dagar.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Förnya token och spara den som hemlighet
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Hemligheten GH_PAT saknas. Se README, steg 8."
            exit 1
          fi
          NEW_TOKEN="$(python main.py fornya-token --till-stdout)"
          echo "::add-mask::$NEW_TOKEN"
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
          echo "Ny token sparad."
