name: Dagens WOD

on:
  schedule:
    # Tiden anges i UTC. 05:17 UTC = 07:17 svensk sommartid, 06:17 vintertid.
    - cron: "17 5 * * *"
    # Reserv: GitHub startar ibland inte schemalagda körningar. Om dagens WOD redan är
    # skapat och publicerat gör den här körningen ingenting.
    - cron: "47 6 * * *"
  workflow_dispatch: # Gör att du kan köra flödet för hand under fliken Actions.

permissions:
  contents: write # Behövs för att lägga upp bilden och spara historiken i repot.

concurrency:
  group: dagens-wod
  cancel-in-progress: false

jobs:
  wod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      WOD_FORMAT: ${{ vars.WOD_FORMAT }} # Tom = karusell. Sätt variabeln till "bild" för en enda bild.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skriv dagens WOD och gör bilden
        run: python main.py wod-skapa --auto

      - name: Lägg upp bilden i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wods.json bilder/
          git diff --cached --quiet || git commit -m "WOD $(date -u +%F)"
          git pull --rebase # Om något annat har pushats under körningen
          git push

      - name: Publicera på Instagram
        run: |
          # Instagram hämtar bilden direkt från det publika repot. Adressen pekar på
          # just den här commiten, så att ingen gammal cachad version kan komma emellan.
          export BILD_BAS_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git rev-parse HEAD)"
          python main.py wod-publicera --auto

      - name: Spara att det är publicerat
        if: always()
        run: |
          git add wods.json bilder/ # bilder/ tar med de gamla bilderna som tagits bort
          git diff --cached --quiet || git commit -m "Publicerat WOD $(date -u +%F)"
          git pull --rebase # Om något annat har pushats under körningen
          git push
